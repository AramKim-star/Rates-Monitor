<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global Rates Monitor</title>
  <meta name="description" content="Global central bank base rates, 10-year government bond yields and real estate cap rates.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%239ec5f4'/%3E%3Cpath d='M8 21l5-5 4 3 7-8' stroke='%230b2545' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=dev">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 16l5-5 4 3 7-8"/></svg>
        </div>
        <div>
          <div class="brand-name" data-i18n="app.title">Global Rates Monitor</div>
          <div class="brand-sub" data-i18n="brand.sub">real estate rates</div>
        </div>
      </div>

      <nav class="nav" aria-label="Sections">
        <a href="#/dashboard" data-route="dashboard">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span data-i18n="nav.dashboard">Dashboard</span>
        </a>
        <a href="#/policy" data-route="policy">
          <svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6"/><path d="M5 10v9M9.5 10v9M14.5 10v9M19 10v9"/><path d="M3 21h18"/></svg>
          <span data-i18n="nav.policy">Base Rates</span>
        </a>
        <a href="#/yields" data-route="yields">
          <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          <span data-i18n="nav.yields">Interest Rates</span>
        </a>
        <a href="#/cpi" data-route="cpi">
          <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
          <span data-i18n="nav.cpi">Inflation (CPI)</span>
        </a>
        <a href="#/caps" data-route="caps">
          <svg viewBox="0 0 24 24"><path d="M4 21V9l8-5 8 5v12"/><path d="M9 21v-6h6v6"/></svg>
          <span data-i18n="nav.caps">Cap Rates</span>
        </a>
      </nav>

      <div class="nav-section" data-i18n="nav.regions">Regions</div>
      <nav class="nav regions" id="region-nav" aria-label="Regions"></nav>

      <nav class="nav nav-secondary" aria-label="More">
        <a href="#/sources" data-route="sources">
          <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h7M9 14h7M9 18h4"/></svg>
          <span data-i18n="nav.sources">Sources</span>
        </a>
      </nav>

      <div class="lang-switch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
        <span class="lang-label" data-i18n="lang.label">Language</span>
        <div class="lang-seg" role="group" aria-label="Language / 언어">
          <button data-lang="en" lang="en">EN</button>
          <button data-lang="ko" lang="ko">한국어</button>
        </div>
      </div>

      <div class="sidebar-foot">
        <div class="status-dot" id="status-dot" aria-hidden="true"></div>
        <div class="status-text">
          <div id="status-title">Loading data…</div>
          <div id="status-sub" class="muted"></div>
        </div>
        <button class="icon-btn" id="refresh-btn" title="Reload data" aria-label="Reload data" data-i18n-title="refresh.title">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" data-i18n-title="menu.open">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div>
          <h1 id="page-title">Dashboard</h1>
          <div class="muted" id="page-sub">Global rates</div>
        </div>
      </header>

      <div class="content" id="content"></div>
    </main>
  </div>

  <div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="i18n.js?v=dev"></script>
  <script src="app.js?v=dev"></script>
</body>
</html>
